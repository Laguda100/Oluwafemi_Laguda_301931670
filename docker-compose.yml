# MIT 8103 Advanced Database Systems - Crestfield University Result Portal
# Local development stack.
#   postgres : Portfolios 1-3 (and the source data for Portfolio 4)
#   mongo    : Portfolio 4
# Portfolio 5 has its own compose file (primary + replica cluster).
#
# Start:  docker compose up -d
# Stop:   docker compose down          (keeps data)
# Reset:  docker compose down -v       (deletes the data volume)

services:
  postgres:
    image: postgres:16.4
    container_name: crestfield-pg
    environment:
      POSTGRES_USER: portal_admin
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-portal_dev_pw}   # local dev only
      POSTGRES_DB: result_portal
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./:/portfolio:ro          # repo mounted read-only so psql can run the scripts
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U portal_admin -d result_portal"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Portfolio 4: document store for transcripts, activity events, feedback
  mongo:
    image: mongo:7.0.14
    container_name: crestfield-mongo
    ports:
      - "27017:27017"
    volumes:
      - mongodata:/data/db
      - ./:/portfolio:ro
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pgdata:
  mongodata:
