# MIT 8103 Advanced Database Systems - Crestfield University Result Portal
# Local development stack. Portfolio 1-3 use the `postgres` service.
# (MongoDB is added in Portfolio 4, the replica in Portfolio 5.)
#
# Start:  docker compose up -d
# Stop:   docker compose down          (keeps data)
# Reset:  docker compose down -v       (deletes the data volume)

services:
  postgres:
    image: postgres:16.4
    container_name: crestfield-pg
    environment:
      POSTGRES_USER: portal_admin
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-portal_dev_pw}   # local dev only
      POSTGRES_DB: result_portal
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./:/portfolio:ro          # repo mounted read-only so psql can run the scripts
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U portal_admin -d result_portal"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
